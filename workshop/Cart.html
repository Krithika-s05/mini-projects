<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Cart - Perfume Store</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* Navigation */

        ul {
            background-color: black;
            color: white;

            display: flex;

            list-style: none;

            padding: 15px;

            justify-content: space-around;

            align-items: center;
        }

        ul a {
            color: white;
            text-decoration: none;
        }

        ul a:hover {
            color: yellow;
        }

        /* Heading */

        h1 {
            text-align: center;
            margin: 30px;
        }

        /* Cart */

        #cartBox {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .cart-item {
            width: 700px;

            display: flex;

            align-items: center;

            background-color: white;

            border: 1px solid gray;

            border-radius: 10px;

            margin: 10px;

            padding: 15px;

            box-shadow: 2px 5px 10px gray;
        }

        .cart-item img {
            width: 120px;
            height: 120px;

            object-fit: contain;

            margin-right: 20px;
        }

        .cart-details {
            flex: 1;
        }

        .cart-details h3 {
            margin-bottom: 10px;
        }

        .remove-btn {
            padding: 10px;

            background-color: red;

            color: white;

            border: none;

            border-radius: 5px;

            cursor: pointer;
        }

        .remove-btn:hover {
            background-color: darkred;
        }

        /* Total */

        .total {
            text-align: center;

            margin: 30px;

            font-size: 24px;

            font-weight: bold;
        }

        .empty {
            text-align: center;

            font-size: 20px;

            margin-top: 50px;
        }

    </style>

</head>


<body>


    <!-- NAVIGATION -->

    <ul>

        <li>
            <a href="Home.html">
                HOME
            </a>
        </li>

        <li>
            <a href="About.html">
                ABOUT
            </a>
        </li>

        <li>
            <a href="allProducts.html">
                PRODUCTS
            </a>
        </li>

        <li>
            <a href="ContactUs.html">
                CONTACT
            </a>
        </li>

        <li>
            <a href="Login.html">
                LOGIN
            </a>
        </li>

        <li>
            <a href="Cart.html">
                🛒 CART
            </a>
        </li>

    </ul>


    <h1>
        🛒 My Cart
    </h1>


    <!-- CART PRODUCTS -->

    <div id="cartBox">

    </div>


    <!-- TOTAL -->

    <div
        class="total"
        id="total"
    >

    </div>


    <script>

        /*
        ================================
        GET CART FROM LOCAL STORAGE
        ================================
        */

        let cart =
            JSON.parse(
                localStorage.getItem("cart")
            ) || [];


        /*
        ================================
        DISPLAY CART
        ================================
        */

        function displayCart() {

            let cartBox =
                document.getElementById("cartBox");

            cartBox.innerHTML = "";


            if (cart.length === 0) {

                cartBox.innerHTML = `
                
                    <div class="empty">
                        Your cart is empty 🛒
                    </div>

                `;

                document.getElementById("total")
                    .innerHTML = "";

                return;

            }


            let totalPrice = 0;


            for (let i = 0; i < cart.length; i++) {

                totalPrice += cart[i].price;


                cartBox.innerHTML += `

                    <div class="cart-item">

                        <img
                            src="${cart[i].image}"
                            alt="${cart[i].name}"
                        >

                        <div class="cart-details">

                            <h3>
                                ${cart[i].brand}
                            </h3>

                            <p>
                                ${cart[i].name}
                            </p>

                            <p>
                                Price:
                                ₹${cart[i].price}
                            </p>

                        </div>


                        <button
                            class="remove-btn"
                            onclick="removeItem(${i})"
                        >
                            REMOVE
                        </button>

                    </div>

                `;

            }


            document.getElementById("total")
                .innerHTML =
                "Total: ₹" + totalPrice;

        }


        /*
        ================================
        REMOVE ITEM
        ================================
        */

        function removeItem(index) {

            cart.splice(index, 1);

            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );

            displayCart();

        }


        /*
        ================================
        LOAD CART
        ================================
        */

        displayCart();

    </script>


</body>

</html>
