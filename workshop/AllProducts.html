    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* NAVIGATION */

        ul {
            background-color: black;
            color: white;

            display: flex;

            font-size: 15px;

            list-style-type: none;

            padding: 15px;

            justify-content: space-around;

            align-items: center;
        }

        ul a {
            color: white;
            text-decoration: none;
        }

        ul a:hover {
            color: yellow;
        }

        /* SEARCH */

        input {
            padding: 10px;
            border: none;
            width: 180px;
        }

        input:focus {
            outline: none;
        }

        .btn-1 {
            padding: 10px;
            border: none;
            background-color: greenyellow;
            cursor: pointer;
        }

        .btn-1:hover {
            background-color: red;
            color: white;
        }

        /* FILTER */

        #dropdown {
            padding: 8px;
        }

        /* TITLE */

        h1 {
            text-align: center;
            margin: 25px;
        }

        /* PRODUCT CONTAINER */

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* CARD */

        .card {
            width: 270px;

            min-height: 350px;

            border: 2px solid gray;

            line-height: 25px;

            border-radius: 10px;

            text-align: center;

            overflow: hidden;

            margin: 20px;

            padding-bottom: 10px;

            background-color: white;

            transition: 0.5s;

            box-shadow: 3px 10px 20px rgb(107, 106, 106);
        }

        .card:hover {
            cursor: pointer;

            transform: scale(1.03);

            box-shadow: 3px 10px 20px rgb(50, 50, 50);
        }

        /* IMAGE */

        .card img {
            width: 100%;

            height: 180px;

            object-fit: contain;

            border-radius: 6px;
        }

        /* TEXT */

        .heading {
            font-size: 17px;
            font-weight: bold;
        }

        /* BUTTON */

        .card-btn {
            width: 90%;

            padding: 10px;

            margin-top: 10px;

            background-color: red;

            color: white;

            border: none;

            border-radius: 5px;

            cursor: pointer;
        }

        .card-btn:hover {
            background-color: green;
        }

    </style>

</head>

    /* =========================
       DISPLAY PRODUCTS
    ========================= */

    function displayProducts(data) {

        document.getElementById("box").innerHTML = "";


        for (let i = 0; i < data.length; i++) {

            document.getElementById("box").innerHTML += `

                <div class="card">

                    <img
                        src="${data[i].image}"
                        alt="${data[i].name}"
                    >

                    <span class="heading">
                        Brand:
                    </span>

                    ${data[i].brand}

                    <br>

                    <span class="heading">
                        Product:
                    </span>

                    ${data[i].name}

                    <br>

                    <span class="heading">
                        Price:
                    </span>

                    ₹${data[i].price}

                    <br>

                    <span class="heading">
                        Description:
                    </span>

                    ${data[i].description}

                    <br>

                    <span class="heading">
                        Rating:
                    </span>

                    ⭐ ${data[i].rating}

                    <br>

                    <button
                        class="card-btn"
                        onclick="addToCart('${data[i].name}')"
                    >
                        ADD TO CART
                    </button>

                </div>

            `;

        }

    }


    /* =========================
       SEARCH
    ========================= */

    function handleClick() {

        let searchValue =
            document.getElementById("search")
            .value
            .toLowerCase()
            .trim();


        let filteredProducts = products.filter(function(product) {

            return (
                product.brand.toLowerCase().includes(searchValue) ||
                product.name.toLowerCase().includes(searchValue)
            );

        });


        displayProducts(filteredProducts);

    }


    /* =========================
       PRICE FILTER
    ========================= */

    function handleDropDown() {

        let userPrice =
            parseInt(
                document.getElementById("dropdown").value
            );


        if (userPrice === 0) {

            displayProducts(products);

            return;

        }


        let filteredProducts =
            products.filter(function(product) {

                return product.price > userPrice;

            });


        displayProducts(filteredProducts);

    }


    /* =========================
       ADD TO CART
    ========================= */

    function addToCart(productName) {

    let product =
        products.find(function(item) {

            return item.name === productName;

        });


    if (product) {

        cart.push(product);


        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );


        alert(
            product.name + " added to cart!"
        );

    }

}


    /* =========================
       DISPLAY PRODUCTS WHEN PAGE LOADS
    ========================= */

    displayProducts(products);
