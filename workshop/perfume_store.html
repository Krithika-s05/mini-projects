<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfume Store</title>

    <style>

        * {
            margin: 0;
        }

        /* Navigation Bar */
        ul {
            background-color: black;
            color: rgb(238, 235, 235);
            display: flex;
            font-size: 15px;
            list-style-type: none;
            padding: 10px;
            justify-content: space-around;
            align-items: center;
        }

        /* Search Box and Button */
        input,
        .btn-1 {
            padding: 10px;
            border: none;
        }

        .btn-1 {
            position: relative;
            right: 6px;
            background-color: greenyellow;
            border: none;
        }

        input:focus {
            outline: none;
        }

        .btn-1:hover {
            background-color: red;
            color: white;
            cursor: pointer;
        }

        /* Product Card */
        .card {
            width: 270px;
            height: 342px;
            border: 2px solid gray;
            line-height: 25px;
            border-radius: 10px;
            text-align: center;
            overflow: hidden;
            margin: 20px;
            transition: 0.5s ease;
            box-shadow: 3px 10px 20px rgb(107, 106, 106);
        }

        .card:hover {
            cursor: pointer;
            box-shadow: 3px 10px 20px rgb(50, 50, 50);
            transform: scale(1.03);
        }

        /* Product Image */
        img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            border-radius: 6px;
        }

        /* Heading */
        .heading {
            font-size: 20px;
            font-weight: 700;
        }

        /* Buy Button */
        .card-btn {
            width: 100%;
            padding: 10px;
            margin-top: 11px;
            background-color: rgb(0, 200, 255);
            color: rgb(37, 35, 35);
            border: none;
        }

        .card-btn:hover {
            background-color: green;
            color: white;
            cursor: pointer;
        }

        /* Cards Container */
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

    </style>

</head>

<body>

    <!-- Navigation Bar -->

    <ul>

        <li>HOME</li>
        <li>ABOUT</li>
        <li>SERVICES</li>
        <li>CONTACT US</li>
        <li>REGISTER</li>
        <li>LOGIN</li>

        <div>

            <input type="text" placeholder="Search here...">

            <button class="btn-1">
                SEARCH
            </button>

        </div>

    </ul>


    <!-- Product Cards -->

    <div id="box" class="container">

    </div>


    <script>

        /*

        /*
           Generate 20 cards
        */

        for (let i = 0; i < 20; i++) {

            `;

        }

    </script>

</body>

</html>
